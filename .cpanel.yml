---
deployment:
  tasks:
    - export DEPLOYPATH=/home/sekawan/apps/sekawanputrapratama
    - /bin/cp -R * $DEPLOYPATH
    - /bin/cp .env.example $DEPLOYPATH/.env
    
    # Install Composer dependencies
    - cd $DEPLOYPATH
    - /usr/local/bin/ea-php82 /opt/cpanel/composer/bin/composer install --optimize-autoloader --no-dev --no-interaction

    # Build frontend/admin assets (Filament theme, etc.)
    - npm install
    - npm run build

    # Run database migrations
    - /usr/local/bin/ea-php82 artisan migrate --force
    
    # Clear all caches
    - /usr/local/bin/ea-php82 artisan config:clear
    - /usr/local/bin/ea-php82 artisan route:clear
    - /usr/local/bin/ea-php82 artisan view:clear
    - /usr/local/bin/ea-php82 artisan cache:clear
    
    # Optimize for production
    - /usr/local/bin/ea-php82 artisan config:cache
    - /usr/local/bin/ea-php82 artisan route:cache
    - /usr/local/bin/ea-php82 artisan view:cache
    - /usr/local/bin/ea-php82 artisan event:cache
    
    # Optimize Composer autoloader
    - /usr/local/bin/ea-php82 /opt/cpanel/composer/bin/composer dump-autoload --optimize --classmap-authoritative
    
    # Set proper permissions
    - chmod -R 755 $DEPLOYPATH/storage
    - chmod -R 755 $DEPLOYPATH/bootstrap/cache
    
    # Restart queue workers
    - /usr/local/bin/ea-php82 artisan queue:restart
